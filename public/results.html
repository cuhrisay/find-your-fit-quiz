<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Your Find Your Fit Results — Cushion Your Assets</title>
<style>
  /* Brand colors from the CYA blog/email guide: red #A61111, yellow #FFC700,
     dark #2C2C2C, off-white #F4F3F1, Poppins font */
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap');
  @import url('https://fonts.googleapis.com/css2?family=Epilogue:wght@700&display=swap');

  /* Without this, any element with width:100% + padding (like .card) renders
     wider than its siblings, since padding gets added on top of the 100%
     instead of being included in it - shifts that box (and anything centered
     inside it) off the shared center line the other elements use. */
  *, *::before, *::after {
    box-sizing: border-box;
  }

  body {
    font-family: 'Poppins', sans-serif;
    color: #2C2C2C;
    margin: 0;
    padding: 40px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    box-sizing: border-box;
    /* Real sky/cloud photo asset. background-size:cover (not stretch) so it
       never distorts regardless of how tall the page renders - the source
       is portrait (2550x3300), plenty wide for any realistic viewport, so
       cover only ever crops vertically, never upscales. Fallback color
       behind it in case the image is slow to load or fails. */
    background-color: #bfe3f7;
    background-image: url('/assets/background.webp');
    background-size: cover;
    background-position: top center;
    background-repeat: no-repeat;
  }
  .page {
    max-width: 720px;
    width: 100%;
  }
  .brand-mark {
    text-align: center;
    margin: 0 auto 28px;
  }
  .brand-mark img {
    display: block;
    width: 100%;
    max-width: 420px;
    height: auto;
    margin: 0 auto;
  }
  .card {
    background: #ffffff;
    max-width: 720px;
    width: 100%;
    padding: 40px;
    border-radius: 4px;
    border: 1px solid #e8e8e8;
  }
  h1 {
    font-family: 'Epilogue', sans-serif;
    font-size: 32px;
    font-weight: 700;
    letter-spacing: -0.015em;
    text-align: center;
    white-space: nowrap;
    margin: 0 0 8px;
  }
  .spec-table {
    margin: 24px 0;
    border-top: 1px solid #eee;
  }
  .spec-row {
    display: flex;
    justify-content: space-between;
    padding: 12px 0;
    border-bottom: 1px solid #eee;
  }
  .spec-label {
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #555555;
  }
  .spec-value {
    font-weight: 500;
    text-align: right;
  }
  .message {
    font-size: 16px;
    line-height: 1.6;
    margin: 24px 0;
  }
  .message h3 {
    font-size: 14px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #A61111;
    margin: 24px 0 8px;
  }
  .message h3:first-child {
    margin-top: 0;
  }
  .message p {
    margin: 0 0 14px;
  }
  .message ul {
    margin: 0 0 14px;
    padding-left: 20px;
  }
  .message li {
    margin: 0 0 8px;
  }
  .message a {
    color: #A61111;
  }
  .cta {
    display: block;
    width: max-content;
    margin: 8px auto 0;
    background: #A61111;
    color: #fff;
    text-decoration: none;
    padding: 14px 28px;
    border-radius: 4px;
    font-weight: 500;
  }
  .loading {
    text-align: center;
    padding: 60px 20px;
    color: #888;
  }
  .error {
    color: #A61111;
  }
  /* Matches the Mailchimp embed style used on the CYA blog (Poppins, uppercase
     letter-spaced labels, off-white inputs, dark uppercase button) so this
     feels like the same, recognizable email signup wherever it appears. */
  .email-capture {
    margin-top: 28px;
    padding: 36px 40px 40px;
    background: #f6f6f6;
    border: 1px solid #e8e8e8;
    border-radius: 4px;
    text-align: center;
  }
  .email-capture-logo {
    margin: 0 0 24px;
  }
  .email-capture-logo img {
    width: 160px;
    height: auto;
    display: inline-block;
  }
  .email-capture-heading {
    font-weight: 600;
    font-size: 22px;
    margin: 0 0 20px;
  }
  .email-capture form {
    max-width: 360px;
    margin: 0 auto;
    text-align: left;
  }
  .ec-field {
    margin-bottom: 18px;
  }
  .ec-field label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #666;
    margin-bottom: 7px;
  }
  .email-capture input {
    width: 100%;
    font-size: 16px;
    font-weight: 300;
    padding: 13px 16px;
    border: 1px solid #d0d0d0;
    border-radius: 3px;
    background: #fafafa;
    color: #333;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s, background 0.2s;
  }
  .email-capture input:focus {
    border-color: #999;
    background: #fff;
  }
  .email-capture .clear {
    text-align: center;
    margin-top: 24px;
  }
  .email-capture button {
    background: #2C2C2C;
    color: #fff;
    border: none;
    padding: 14px 28px;
    border-radius: 4px;
    font-weight: 500;
    font-size: 13px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-family: inherit;
    cursor: pointer;
    min-width: 200px;
    white-space: nowrap;
    transition: background 0.2s;
  }
  .email-capture button:hover {
    background: #444;
  }
  .email-capture button:disabled {
    opacity: 0.6;
    cursor: default;
  }
  .email-capture-note {
    text-align: center;
    font-size: 12px;
    font-weight: 300;
    color: #333;
    letter-spacing: 0.04em;
    margin: 14px 0 0;
  }
  .email-capture-error {
    text-align: center;
    font-size: 13px;
    color: #A61111;
    margin: 10px 0 0;
  }
  .email-capture-success {
    font-weight: 500;
    margin: 0;
  }
  .site-footer {
    max-width: 720px;
    width: 100%;
    margin-top: 32px;
    padding-top: 24px;
    border-top: 1px solid #e0dfdb;
    text-align: center;
    color: #7a7a7a;
    font-size: 13px;
    line-height: 1.7;
  }
  .site-footer img {
    display: block;
    height: 40px;
    width: auto;
    margin: 0 auto 12px;
    opacity: 0.85;
  }
  .site-footer a {
    color: #7a7a7a;
    text-decoration: underline;
  }
  .site-footer .tagline {
    margin: 0 0 4px;
  }

  /* The heading is deliberately forced to one line (white-space: nowrap) at
     a large size - that stops fitting the card's content width on small
     phones. Shrink the card's padding a bit and the heading down to a size
     confirmed (via direct measurement) to still fit on one line as low as
     360px viewport width, rather than letting it wrap or overflow. Placed
     last in the stylesheet on purpose - at equal specificity, a media query
     earlier in the file loses to an unconditional rule that comes after it. */
  @media (max-width: 480px) {
    .card {
      padding: 24px;
    }
    h1 {
      font-size: 24px;
    }
  }
</style>
</head>
<body>
  <div class="page">
    <div class="brand-mark">
      <img alt="Cushion Your Assets — Find Your Fit Quiz" src="/assets/logo.webp" />
    </div>
    <div class="card" id="card">
      <div class="loading" id="loading">Finding your fit…</div>
    </div>
    <div class="site-footer">
      <img alt="Cushion Your Assets" src="/assets/footer-logo.webp" />
      <p class="tagline">Cushion Your Assets — the patented pelvic pain relief cushion.</p>
      <p>
        Questions about your fit? Email <a href="mailto:support@cushionyourassets.com">support@cushionyourassets.com</a>
        or visit <a href="https://cushionyourassets.com">cushionyourassets.com</a>.
      </p>
      <p>&copy; 2026 Cushion Your Assets. All rights reserved. ·
        <a href="https://www.cushionyourassets.com/privacy-policy">Privacy Policy</a>
      </p>
    </div>
  </div>

  <script>
    // ACTION NEEDED: set this to your actual deployed Vercel domain, or leave
    // as a relative path if this page is served from the same domain as the
    // API functions (recommended - simplest setup).
    const RESULT_ENDPOINT = '/api/quiz-result';
    const EMAIL_CAPTURE_ENDPOINT = '/api/quiz-capture-email';

    // Tally's redirect URL should be set to something like:
    //   https://yourdomain.vercel.app/results.html?id=@SubmissionID
    // (use Tally's "@" merge syntax in the redirect URL field to insert the
    // real submission ID - see Tally's Redirect on Completion settings)
    const params = new URLSearchParams(window.location.search);
    const submissionId = params.get('id');

    const card = document.getElementById('card');

    function renderResult(data) {
      const r = data.result;
      let secondCushionHtml = '';
      if (r.secondCushion && r.secondCushion.suggestion) {
        const s = r.secondCushion.suggestion;
        const valueText = s.firmnessRange ? `${s.thickness} — ${s.firmnessRange}` : s.thickness;
        secondCushionHtml = `
          <div class="spec-row">
            <span class="spec-label">Also consider</span>
            <span class="spec-value">${valueText}</span>
          </div>`;
      }
      card.innerHTML = `
        <h1>We Have Your Fit! ✅</h1>
        <div class="spec-table">
          <div class="spec-row">
            <span class="spec-label">Product</span>
            <span class="spec-value">${r.product}</span>
          </div>
          <div class="spec-row">
            <span class="spec-label">Firmness</span>
            <span class="spec-value">${r.firmness}</span>
          </div>
          <div class="spec-row">
            <span class="spec-label">Size</span>
            <span class="spec-value">${r.size}</span>
          </div>
          <div class="spec-row">
            <span class="spec-label">Thickness</span>
            <span class="spec-value">${r.thickness}</span>
          </div>
          ${secondCushionHtml}
        </div>
        <div class="message">${data.message}</div>
        <a class="cta" href="${r.orderUrl}">${r.orderLabel}</a>
        <div class="email-capture" id="emailCapture">
          <p class="email-capture-heading">Want your fit emailed to you? Get 10% off, too.</p>
          <div class="email-capture-logo">
            <img src="/assets/logo.webp" alt="Cushion Your Assets" />
          </div>
          <form id="emailCaptureForm">
            <div class="ec-field">
              <label for="captureFirstName">First Name</label>
              <input type="text" id="captureFirstName" placeholder="Your first name" />
            </div>
            <div class="ec-field">
              <label for="captureEmail">Email Address</label>
              <input type="email" id="captureEmail" placeholder="your@email.com" required />
            </div>
            <div class="clear">
              <button type="submit">Email Me My Results</button>
            </div>
            <p class="email-capture-note">By submitting, you agree to receive marketing emails from Cushion Your Assets. Unsubscribe anytime.</p>
            <p class="email-capture-error" id="emailCaptureError"></p>
          </form>
        </div>
      `;
      attachEmailCapture();
    }

    function attachEmailCapture() {
      const form = document.getElementById('emailCaptureForm');
      if (!form) return;
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('captureEmail').value.trim();
        const firstName = document.getElementById('captureFirstName').value.trim();
        const errorEl = document.getElementById('emailCaptureError');
        const submitBtn = form.querySelector('button[type="submit"]');
        errorEl.textContent = '';
        submitBtn.disabled = true;
        submitBtn.textContent = 'Sending…';
        try {
          const res = await fetch(EMAIL_CAPTURE_ENDPOINT, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ submissionId, email, firstName }),
          });
          const data = await res.json();
          if (!res.ok || data.status !== 'ok') {
            throw new Error(data.error || 'Something went wrong.');
          }
          document.getElementById('emailCapture').innerHTML =
            '<p class="email-capture-success">Sent! Check your inbox for your results and your 10% off code.</p>';
        } catch (err) {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Email me my results';
          errorEl.textContent =
            "Something went wrong — please try again, or email us at support@cushionyourassets.com.";
        }
      });
    }

    function renderError(msg) {
      card.innerHTML = `<div class="loading error">${msg}</div>`;
    }

    async function poll() {
      if (!submissionId) {
        renderError(
          "We couldn't find your submission. Please try the quiz again, or email us at support@cushionyourassets.com."
        );
        return;
      }
      try {
        const res = await fetch(`${RESULT_ENDPOINT}?id=${encodeURIComponent(submissionId)}`);
        const data = await res.json();
        if (data.status === 'ready') {
          renderResult(data);
        } else if (data.status === 'pending') {
          setTimeout(poll, 1500);
        } else {
          renderError(
            "Something went wrong finding your result. Please try the quiz again, or email us at support@cushionyourassets.com and we'll help."
          );
        }
      } catch (err) {
        renderError(
          "Something went wrong loading your result. Check your email for a copy, or reach out at support@cushionyourassets.com."
        );
      }
    }

    // Give the webhook a head start before the first poll, since it hasn't
    // even been triggered until roughly the moment this page loads.
    setTimeout(poll, 800);

    // Stop polling forever if something's badly wrong - cap at ~30 seconds.
    setTimeout(() => {
      if (card.innerHTML.includes('Finding your fit')) {
        renderError(
          "This is taking longer than expected. Please refresh in a moment, or email us at support@cushionyourassets.com and we'll send your result directly."
        );
      }
    }, 30000);
  </script>
</body>
</html>
